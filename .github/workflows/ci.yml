name: Creator OS CI

on:
  push:
    branches: [ canonical ]
  pull_request:
    branches: [ canonical ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libmp3lame-dev
      - name: Disk space before
        run: df -h
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Gate 1 — Check
        run: cargo check --workspace
      - name: Gate 2 — Format
        run: cargo fmt --check
      - name: Gate 3 — Clippy
        run: cargo clippy --workspace -- -D warnings -A clippy::needless_range_loop -A clippy::too_many_arguments -A clippy::new_without_default
      - name: Gate 4 — Unit tests
        run: cargo test --lib --workspace
      - name: Gate 4b — Unit tests (Features)
        run: cargo test --lib -p sp314-dsp --features cli
      - name: Gate 5 — Domain quality
        run: |
          cargo test -p sp314-dsp --test four_stem_contract -- --test-threads=2
          cargo test -p sp314-dsp --test stress -- --test-threads=2
          cargo test -p m0d --test e2e_golden_pathway -- --test-threads=2
          cargo test -p m0d --test e2e_corpus_integration -- --test-threads=2
          cargo test -p m0d --test e2e_maestro_ducking -- --test-threads=2
          cargo test -p m0d --test e2e_mastering_quality -- --test-threads=2
      - name: Gate 6 — Full workspace
        run: cargo test --workspace

  # Renamed per northstar §Ρ.4 (2026-08-21): verifies ARM64 workspace buildability.
  # Does NOT check cross-platform bit-exact determinism (libm calls differ across archs).
  ci-arm:
    name: ARM64 Build Check
    runs-on: macos-latest
    env:
      LIBRARY_PATH: /opt/homebrew/lib
      LDFLAGS: -L/opt/homebrew/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install System Dependencies (macOS)
        run: brew install lame
      - name: Disk space before
        run: df -h
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Gate 1 — Check
        run: cargo check --workspace
