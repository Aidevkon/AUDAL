[workspace]
resolver = "2"
members = [
    "lineos/m0/m0-daemon", # restored — migrating to lineos-types
    "lineos/m1/lineos-types",
    "lineos/m1/sp314-dsp",
    "lineos/m1/sp314-orchestrator",
    "lineos/m1/conformance",
    "lineos/m1/telemetry",
    "lineos/m1/metadata",
    "lineos/m1/insights",
    "lineos/m1/rule-engine",
    "lineos/m1/xaak",
    "lineos/m1/lineos-corpus",
    "lineos/m1/lame-sys",           # Phase 13A: LAME dynamic FFI (LGPL compliant)
    "apps/stillair/src-tauri",
    "apps/stillair/cockpit-dioxus",   # Phase 11: Dioxus 0.6 Cockpit
    "creator-os/shared/adapter-runtime", "lineos/m1/sp314-nodes", "pipelines/pipelineforge", "apps/runtime/loom",  # Phase 8: Aether LLM adapter runtime
    "aether",
    "integration",
    "proof",
    "shared/aether-bridge",
]
# Phase 1:  m0-daemon             per P1-001
# Phase 2:  sp314-dsp             per P2-001
# Phase 3:  telemetry + metadata + insights  per P3-005
# Phase 4:  rule-engine           per P4-007
# Phase 5:  stillair + stillair-frontend  per P5-001
# Phase 8:  adapter-runtime       per P8-002
# Phase 11: cockpit-dioxus        per P11-001

[profile.release]
# ΗΤΑΝ 'z' (βελτιστοποίηση για ΜΕΓΕΘΟΣ). Για ένα DSP
# engine που τρέχει τοπικά, το μέγεθος του binary δεν
# μετράει και το inlining μετράει πολύ.
# git log -S "opt-level" -- Cargo.toml = ΚΕΝΟ: η
# πρόθεση πίσω από το 'z' δεν καταγράφηκε ποτέ.
# Το μόνο τεκμήριο είναι ότι το cockpit είχε ΔΙΚΟ ΤΟΥ
# profile (3 + lto) που το cargo αγνοούσε υπέρ του
# workspace 'z' — άρα το 'z' προϋπήρχε.
# ⚠ ΑΛΛΑΖΕΙ ΠΙΘΑΝΩΣ ΤΑ BYTES ΕΞΟΔΟΥ. Γίνεται ΤΩΡΑ
# επειδή δεν υπάρχουν χρήστες ούτε δημοσιευμένα
# certificates. northstar §Ρ.
opt-level = 3
codegen-units = 1  # declared 2026-08-20: explicit, stable, certificate-declarable (northstar §Ρ step 1)

# cockpit-dioxus originally declared its own release profile
# (opt-level=3, lto, codegen-units=1 — max-speed WASM) which cargo
# silently ignored in favor of the workspace 'z'. Preserved here as
# a named profile; the dioxus build should opt into it explicitly.
[profile.release-cockpit]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

# Optimize all third-party dependencies (like rustfft) to speed up math
[profile.dev.package."*"]
opt-level = 3

# Optimize our DSP and engine crates
[profile.dev.package.sp314-dsp]
opt-level = 3

[profile.dev.package.sp314-nodes]
opt-level = 3

[profile.dev.package.xaak]
opt-level = 3
