[package]
name    = "aether"
version = "0.1.0"
edition = "2021"
# Ιδιωτικό, εμπορικό. Η παραχώρηση αδείας είναι
# απόφαση του ιδιοκτήτη — ΟΧΙ προεπιλογή εργαλείου.
# (2026-09-06· repo ιδιωτικό, μηδέν δημοσιεύσεις)
license = "UNLICENSED"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml  = "0.8"
sha2  = "0.10"
lineos-types = { path = "../lineos/m1/lineos-types" }
libm  = "0.2"

[dev-dependencies]
serde_json = "1.0"
lineos-corpus = { path = "../lineos/m1/lineos-corpus" }

[[test]]
name = "corpus_contract"
path = "tests/corpus_contract.rs"
