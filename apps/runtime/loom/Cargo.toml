[package]
name    = "loom"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sp314-nodes  = { path = "../../../lineos/m1/sp314-nodes" }
wasm-bindgen = "0.2"
serde_json   = "1.0"
serde = { version = "1.0", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["flac"] }

[profile.release]
opt-level = 'z'

[dev-dependencies]
wasm-bindgen-test = "0.3"
pipelineforge = { path = "../../../pipelines/pipelineforge" }
flacenc = "0.3.1"
