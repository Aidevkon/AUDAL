[package]
name    = "stillair-cockpit"
version = "0.1.0"
edition = "2021"
description = "Still Air — Dioxus 0.6 Cockpit (Phase 11)"
license = "MIT"

# Dioxus web: WASM target, served to Tauri WebView via trunk
# window.__TAURI_INTERNALS__ is injected by Tauri (withGlobalTauri: true)
# Amendment A-002 §2: UI is Disposable — this crate may be replaced
# Amendment A-002 §3: Core crates are NOT dependencies of this crate
[dependencies]
dioxus                = { version = "0.6", features = ["web"] }
dioxus-document       = "0.6"
serde                 = { version = "1",   features = ["derive"] }
serde_json            = "1"
serde-wasm-bindgen    = "0.6"
wasm-bindgen          = "0.2"
wasm-bindgen-futures  = "0.4"
web-sys               = { version = "0.3", features = ["console", "Window", "Document",
                                                       "Element", "DomRect"] }
js-sys                = "0.3"
gloo-timers           = { version = "0.3", features = ["futures"] }  # P12B-004: 500ms poll

# ui-isolation-check.sh invariant:
# sp314-dsp, lineos-telemetry, lineos-rule-engine, m0d, adapter-runtime
# xaak, cpal, ringbuf MUST NOT appear in this dependency tree.
