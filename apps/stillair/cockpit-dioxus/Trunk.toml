# Trunk.toml — Dioxus Cockpit (Phase 14)
# Authority: P11-009 · P14-002 · Amendment A-002 §7
#
# CSS is served as a Trunk-managed asset (link tag in index.html),
# NOT embedded via include_str!. This enables CSS hot-reload without
# WASM recompile — critical for rapid design iteration.
#
# Architecture:
#   - styles.css → link data-trunk rel="css" in index.html
#   - trunk serve watches assets/ and src/ for changes
#   - CSS change → browser hot-reload (no WASM recompile)
#   - Rust change → full WASM recompile

[build]
target = "index.html"

# Explicitly watch assets/ so CSS changes trigger browser reload
[watch]
ignore = []

[[hooks]]
stage = "pre_build"
command = "echo"
command_arguments = ["Building Still Air Cockpit (Dioxus 0.6 web)..."]
