<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Still Air — Creator OS</title>
  <meta name="description" content="Still Air — Precision mastering cockpit" />

  <!--
    Trunk copies assets/styles.css to dist/ and injects a <link> here.
    CSS changes hot-reload without WASM recompile (trunk watches assets/).
    Authority: Phase 14 P14-002 · ui-agent-context.md §7.
  -->
  <link data-trunk rel="css" href="assets/tokens.css" />
  <link data-trunk rel="css" href="assets/base.css" />
  <link data-trunk rel="css" href="assets/panels.css" />
  <link data-trunk rel="css" href="assets/transport.css" />
  <link data-trunk rel="css" href="assets/components.css" />
  <link data-trunk rel="css" href="assets/ab-toggle.css" />
  <link data-trunk rel="css" href="assets/scrub-knob.css" />
  <link data-trunk rel="css" href="assets/oled-tile.css" />
  <link data-trunk rel="css" href="assets/dsp-screen.css" />

  <!--
    Trunk injects the WASM bundle here at build time.
    withGlobalTauri: true ensures window.__TAURI_INTERNALS__ is available
    before the WASM module initializes.
  -->
  <link data-trunk rel="css" href="assets/cockpit.css">
</head>
<body>
  <div id="main"></div>
<script>
(function() {
  const ENDPOINT = '/m0/dev/snapshot';
  const DEBOUNCE_MS = 400;
  const MAX_NODES = 500; // safety cap — αν το tree είναι πιο μεγάλο, κόβουμε εκεί (καλύτερο partial snapshot παρά freeze)
  const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'svg', 'path']); // svg/path: skip children, καμία αξία για debugging, μπορεί να είναι βαθύ tree σε icons

  let debounceTimer = null;
  let nodeCount = 0;

  function serializeNode(el) {
    if (nodeCount >= MAX_NODES) return null;
    if (SKIP_TAGS.has(el.tagName)) return null;
    nodeCount++;

    const rect = el.getBoundingClientRect();
    const attrs = {};
    for (const attr of el.attributes || []) {
      if (attr.name.startsWith('data-') || attr.name === 'id' || attr.name === 'class' || attr.name.startsWith('aria-')) {
        attrs[attr.name] = attr.value;
      }
    }

    const node = {
      tag: el.tagName.toLowerCase(),
      attrs,
      rect: { x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.width), h: Math.round(rect.height) },
      visible: rect.width > 0 && rect.height > 0 && getComputedStyle(el).visibility !== 'hidden' && getComputedStyle(el).display !== 'none',
    };

    if (el.value !== undefined && el.tagName === 'INPUT') node.value = el.value;
    if (el.checked !== undefined && el.tagName === 'INPUT') node.checked = el.checked;
    if (el.disabled !== undefined) node.disabled = el.disabled;

    // Direct text content only (not aggregated from children) — avoids
    // duplicating the same text at every ancestor level.
    let ownText = '';
    for (const child of el.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        ownText += child.textContent;
      }
    }
    ownText = ownText.trim();
    if (ownText) node.text = ownText;

    if (el.tagName === 'IMG' || el.tagName === 'AUDIO' || el.tagName === 'VIDEO') {
      if (el.src) node.src = el.src;
    }

    const children = [];
    for (const child of el.children) {
      const serialized = serializeNode(child);
      if (serialized) children.push(serialized);
      if (nodeCount >= MAX_NODES) break;
    }
    if (children.length) node.children = children;

    return node;
  }

  // DOM is expensive to serialize (up to 500 nodes). FSM state is cheap
  // (~300 bytes) and is what we actually query. So: push state on every
  // mutation, but only attach a fresh DOM tree at most once every
  // DOM_INTERVAL_MS.
  const DOM_INTERVAL_MS = 2000;
  let lastDomTs = 0;

  function readState() {
    try {
      const raw = window.__COCKPIT_STATE__;
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function sendSnapshot() {
    const now = Date.now();
    const state = readState();

    // Decide whether to attach DOM this time
    let dom = null;
    if (now - lastDomTs >= DOM_INTERVAL_MS) {
      const root = document.getElementById('main');
      if (root) {
        nodeCount = 0;
        dom = serializeNode(root);
        lastDomTs = now;
      }
    }

    const payload = { ts: now, state, dom };
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(() => {}); // silent fail — debug tool, ΔΕΝ πρέπει ποτέ να σπάσει το UI αν το backend δεν τρέχει
  }

  function scheduleSnapshot() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(sendSnapshot, DEBOUNCE_MS);
  }

  const observer = new MutationObserver(scheduleSnapshot);
  const root = document.getElementById('main');
  if (root) {
    observer.observe(root, { childList: true, subtree: true, attributes: true });
    scheduleSnapshot(); // αρχικό snapshot, μην περιμένουμε την πρώτη αλλαγή
  }
})();
</script>
</body>
</html>
