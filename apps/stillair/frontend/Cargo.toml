[package]
name = "stillair-frontend"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Still Air — Leptos WASM frontend (Cockpit UI)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos       = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
web-sys      = { version = "0.3", features = [
    "File", "FileList", "DragEvent", "DataTransfer",
    "EventTarget", "HtmlInputElement", "Window",
    "Document", "Element",
] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
