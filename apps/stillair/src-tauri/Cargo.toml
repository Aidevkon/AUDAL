[package]
name = "stillair"
version = "0.1.0"
edition = "2021"
# Ιδιωτικό, εμπορικό. Η παραχώρηση αδείας είναι
# απόφαση του ιδιοκτήτη — ΟΧΙ προεπιλογή εργαλείου.
# (2026-09-06· repo ιδιωτικό, μηδέν δημοσιεύσεις)
license = "UNLICENSED"
publish = false
description = "Still Air — Creator OS mastering cockpit (Tauri backend)"

[lib]
name = "stillair_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "stillair"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64              = "0.22"
tauri               = { version = "2", features = [] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
tokio               = { version = "1", features = ["full"] }
reqwest             = { version = "0.12", features = ["json"] }
thiserror           = "1"
uuid                = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
lineos-rule-engine  = { path = "../../../lineos/m1/rule-engine" }
lineos-types        = { version = "0.1.0", path = "../../../lineos/m1/lineos-types", features = ["bincode"] }
adapter-runtime     = { path = "../../../creator-os/shared/adapter-runtime" }  # Phase 8: Aether
toml                = "0.8"  # Phase 9: runtime coach_prompt.toml loading
dirs                = "5"    # Phase 10: default export directory (~/.local/audio/StillAir)
chrono              = { version = "0.4", features = ["serde"] }  # Phase 10: export timestamps
printpdf            = "0.7"  # Phase 13B: BMR-128 PDF report — pure Rust, MIT
libm                = "0.2"  # Phase 14: SVG path math in visualization.rs — no std::f32
bincode = "2"
tracing = "0.1"
serde_arrays = "0.1"
reqwest-eventsource = "0.6"
futures-util = "0.3"
