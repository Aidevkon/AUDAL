[graph]
targets = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "ISC",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
deny = [
    { name = "ring" },
    { name = "whisper-rs" },
    { name = "ffmpeg-sys" },
]

[advisories]
ignore = ["RUSTSEC-2026-0097"]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
