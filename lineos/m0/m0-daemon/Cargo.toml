[package]
name = "m0d"
version = "0.1.0"
license = "MIT"
edition = "2021"
# M0 Constitution v2.0
# inherits_from = ["creator-os-invariants", "lineos-constitution"]

[dependencies]
libm = "0.2"
tokio        = { version = "1", features = ["full"] }
axum         = "0.7"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", features = ["json"] }
toml         = "0.8"
sha2         = "0.10"
blake3       = "1"
hex          = "0.4"
ed25519-dalek = "2"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow       = "1"
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1", features = ["v4"] }
sp314-dsp    = { path = "../../m1/sp314-dsp" }
lineos-types = { path = "../../m1/lineos-types" }
pipelineforge = { path = "../../../pipelines/pipelineforge" }
openclaw      = { path = "../../../apps/runtime/openclaw" }
sp314-nodes   = { path = "../../m1/sp314-nodes" }
lineos-telemetry = { path = "../../m1/telemetry" }  # Phase 9: real LRA/momentary/short-term
aether-bridge = { path = "../../../shared/aether-bridge" }
integration   = { path = "../../../integration" }
lineos-corpus = { path = "../../m1/lineos-corpus" }
# P7-001: Audio decode — M0 responsibility (never in sp314-dsp)
# Authority: LineOS Constitution v2.0 §05 · Phase 7 master prompt
symphonia    = { version = "0.5", features = [
    "mp3",
    "flac",
    "pcm",
    "aiff",
    "wav",
    "isomp4",
] }
rubato       = "0.15"   # SincFixedIn resampling → 48000 Hz
# Phase 10: Audio export — WAV + FLAC
# Authority: Phase 10 task-decomposition §Library Decisions
hound        = "3.5"    # WAV write — pure Rust, MIT
# Opus: requires libopus-dev (C library). Wired in Phase 11.
# audiopus = "0.3.0-rc.0"
# Phase 12A: xaak PCM kernel (Amendment A-003 §1)
# No 'playback' feature — cpal remains in xaak, not in m0d
xaak         = { path = "../../m1/xaak" }

# Phase 13: MP3 export via LAME
# LGPL compliance: lame-sys links libmp3lame DYNAMICALLY (LGPL §6 — replaceability preserved).
# NEVER use mp3lame-encoder — it statically links LAME (LGPL violation).
# See: lineos/plan/phase-13/LAME-LGPL-NOTICE.md
# System dependency: libmp3lame.so (apt: libmp3lame-dev or libmp3lame0)
lame-sys = { path = "../../m1/lame-sys" }
aether = { version = "0.1.0", path = "../../../aether" }



[dev-dependencies]
tokio-test = "0.4"
tempfile   = "3"
rand       = "0.8"

[features]
test_utils = []

[lib]
name = "m0d"
path = "src/main.rs"

[[bin]]
name = "test_engine"
path = "src/bin/test_engine.rs"
