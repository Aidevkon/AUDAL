[package]
name        = "lineos-insights"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
# Authority: LineOS Constitution v2.0 §07
# Comparator rule: evaluates pass/fail from measurements — never raw audio.

[dependencies]
lineos-types     = { path = "../lineos-types" }
lineos-telemetry = { path = "../telemetry" }
lineos-metadata  = { path = "../metadata" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

[dev-dependencies]
serde_json = "1"
libm       = "0.2"
