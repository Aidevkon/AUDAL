[package]
name    = "lame-sys"
version = "0.1.0"
edition = "2021"
# Ιδιωτικό, εμπορικό. Η παραχώρηση αδείας είναι
# απόφαση του ιδιοκτήτη — ΟΧΙ προεπιλογή εργαλείου.
# (2026-09-06· repo ιδιωτικό, μηδέν δημοσιεύσεις)
license = "UNLICENSED"
publish = false
description = "LGPL-compliant dynamic bindings to system libmp3lame (lame-sys)"

# Authority: docs/licenses/LAME-LGPL-NOTICE.md §1 — dynamic linking only
# This crate links libmp3lame.so DYNAMICALLY via pkg-config (fallback: rustc-link-lib=dylib).
# NEVER link statically — that is an LGPL violation.
# System install: sudo apt install libmp3lame-dev

[build-dependencies]
pkg-config = "0.3"

[lib]
name = "lame_sys"
