[package]
name        = "lineos-metadata"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
# Authority: LineOS Constitution v2.0 §07
# Comparator rule: generates reports from Ebu128Measurement — never raw audio.

[dependencies]
sp314-dsp        = { path = "../sp314-dsp" }
lineos-telemetry = { path = "../telemetry" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

[dev-dependencies]
serde_json = "1"
libm       = "0.2"
