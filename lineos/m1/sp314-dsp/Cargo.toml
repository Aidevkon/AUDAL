[package]
name = "sp314-dsp"
version = "3.0.0"
edition = "2021"
license = "MIT"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
libm = "0.2"
rustfft = "6"
sha2 = { version = "0.10", optional = true }
hex  = { version = "0.4", optional = true }
ringbuf = { version = "0.3", optional = true }
hound = { version = "3.5", optional = true }
flacenc = { version = "0.3", optional = true }
lineos-types = { path = "../lineos-types" }
lineos-corpus = { path = "../lineos-corpus" }
xaak = { path = "../xaak" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cpal]
version  = "0.15"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4"

[dev-dependencies]
hound = "3.5"
dhat = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
claxon = "0.4"
sha2 = "0.10"
approx = "0.5"

[features]
default = []
cli = ["cpal", "hound", "flacenc", "ringbuf", "sha2", "hex"]

[[bin]]
name = "sp314_master"
path = "src/bin/sp314_master.rs"
required-features = ["cli"]

[[bin]]
name = "sp314_live"
path = "src/bin/sp314_live.rs"
required-features = ["cli"]

[[bin]]
name = "sp314_stems"
path = "src/bin/sp314_stems.rs"
required-features = ["cli"]

[[test]]
name = "stress"
path = "tests/stress/mod.rs"
