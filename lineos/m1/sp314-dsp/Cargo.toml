[package]
name = "sp314-dsp"
version = "3.0.0"
edition = "2021"
# Ιδιωτικό, εμπορικό. Η παραχώρηση αδείας είναι
# απόφαση του ιδιοκτήτη — ΟΧΙ προεπιλογή εργαλείου.
# (2026-09-06· repo ιδιωτικό, μηδέν δημοσιεύσεις)
license = "UNLICENSED"
publish = false

[dependencies]
arc-swap = "1.9.1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
libm = "0.2"
rustfft = "6"
ringbuf = { version = "0.3", optional = true }
hound = "3.5"
flac-codec = { version = "1.3", default-features = false }
lineos-types = { path = "../lineos-types" }
lineos-corpus = { path = "../lineos-corpus" }
xaak = { path = "../xaak" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cpal]
version  = "0.15"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4"

[dev-dependencies]
hound = "3.5"
dhat = "0.3"
rubato = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
claxon = "0.4"
sha2 = "0.10"
approx = "0.5"
tempfile = "3.27.0"
symphonia = { version = "0.5", features = ["all"] }

[features]
default = []
realtime = ["cpal", "ringbuf"]

[[bin]]
name = "sp314_stems"
path = "src/bin/sp314_stems.rs"

[[test]]
name = "stress"
path = "tests/stress/mod.rs"

[[test]]
name = "adm_bwf_integration"

[[test]]
name = "fixture_factory"
