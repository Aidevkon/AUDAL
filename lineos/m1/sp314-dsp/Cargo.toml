[package]
name = "sp314-dsp"
version = "3.0.0"
edition = "2021"
license = "MIT"

[dependencies]
libm = "0.2"
rustfft = "6"
rubato = "0.15"
sha2 = "0.10"
hex  = "0.4"
ringbuf = "0.3"
hound = { version = "3.5", optional = true }
flacenc = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cpal]
version  = "0.15"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
claxon = "0.4"

[features]
default = []
cli = ["cpal", "hound", "flacenc"]

[[bin]]
name = "test_engine"
path = "src/bin/test_engine.rs"
required-features = ["cli"]

[[bin]]
name = "sp314_master"
path = "src/bin/sp314_master.rs"
required-features = ["cli"]

[[bin]]
name = "sp314_live"
path = "src/bin/sp314_live.rs"
required-features = ["cli"]
