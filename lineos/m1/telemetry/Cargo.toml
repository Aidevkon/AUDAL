[package]
name        = "lineos-telemetry"
version     = "0.1.0"
edition     = "2021"
# Ιδιωτικό, εμπορικό. Η παραχώρηση αδείας είναι
# απόφαση του ιδιοκτήτη — ΟΧΙ προεπιλογή εργαλείου.
# (2026-09-06· repo ιδιωτικό, μηδέν δημοσιεύσεις)
license = "UNLICENSED"
publish = false
# Authority: LineOS Constitution v2.0 §07
# Comparator rule: reads Golden Blob only — never re-measures raw audio.

[dependencies]
sp314-dsp  = { path = "../sp314-dsp" }
lineos-types = { path = "../lineos-types" }
libm       = "0.2"
serde      = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", optional = true }

[features]
default = ["std"]
std     = ["serde_json", "serde/std"]

[dev-dependencies]
serde_json = "1"
libm       = "0.2"
hound      = "3.4"
