[package]
name    = "xaak"
version = "0.1.0"
edition = "2021"
# Ιδιωτικό, εμπορικό. Η παραχώρηση αδείας είναι
# απόφαση του ιδιοκτήτη — ΟΧΙ προεπιλογή εργαλείου.
# (2026-09-06· repo ιδιωτικό, μηδέν δημοσιεύσεις)
license = "UNLICENSED"
publish = false
# Amendment A-003 §1: Internal PCM Kernel — Phase 12 activation
# Authority: Creator OS Amendment A-003 · LineOS Constitution v2.0

[features]
debug-telem = []

[dependencies]
ringbuf  = "0.4"                          # lock-free SPMC ring buffer — MIT
cpal     = "0.15"                         # audio I/O backend — Apache-2.0
uuid     = { version = "1", features = ["v4"] }
tracing  = "0.1"
serde    = { version = "1", features = ["derive"] }
bincode = "2"
lineos-types = { version = "0.1.0", path = "../lineos-types", features = ["bincode"] }
realfft = "3"
rustfft = "6"
memmap2 = "0.9.10"
arc-swap = "1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
