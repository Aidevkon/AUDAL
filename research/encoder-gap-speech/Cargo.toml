[package]
name = "encoder-gap-speech"
version = "0.1.0"
edition = "2021"

# F-077: standalone measurement crate, detached from the root workspace
# (own [workspace] table below) — same pattern as research/musdb-lab's
# oracle_extract/dbus_eval. Depends on m0d by path so it exercises the
# REAL deliver-path function (export_mp3_acx), not a re-implementation.
[dependencies]
m0d = { path = "../../lineos/m0/m0-daemon" }
lineos-types = { path = "../../lineos/m1/lineos-types" }
sp314-dsp = { path = "../../lineos/m1/sp314-dsp" }
# 2026-08-24: restoration_alive.rs needs the actual production DspNode
# impls (DeEsserNode/DeHumNode/NoiseGateNode) to null-test them, not a
# re-implementation.
sp314-nodes = { path = "../../lineos/m1/sp314-nodes" }
# 2026-08-25: ltass_sibilance.rs καλεί τον ΠΡΑΓΜΑΤΙΚΟ run_trunk_pass
# για το 8-band spectral profile — ό,τι κάνει ο executor.rs:282.
sp314-orchestrator = { path = "../../lineos/m1/sp314-orchestrator" }
# 2026-09-13: expander_audition διαβάζει leaning/confidence ανά τμήμα και
# καλεί flag_escalation_candidates — το ΙΔΙΟ κριτήριο που κρίνει τη λωρίδα.
lineos-corpus = { path = "../../lineos/m1/lineos-corpus" }
# F-077 round 2: needed to independently reconstruct the pre-encode
# 44.1kHz mono buffer (same public rubato params export.rs documents),
# since export_mp3_acx does not expose that buffer. Pinned to the exact
# versions m0d/sp314-dsp resolve (Cargo.lock, root workspace) for fidelity.
rubato = "0.15"
libm = "0.2"
sha2 = "0.10"
# 2026-08-24: deess_threshold.rs needs an FFT for spectral centroid of the
# removed (in-out) signal. Pinned to the exact version sp314-dsp resolves.
rustfft = "6"
# 2026-08-24: execution_order.rs calls the REAL run_dsp() (dsp_pipeline.rs)
# to capture graph.execution_order from a real render, not a re-implementation.
# xaak::repo::DspState + arc-swap are run_dsp's head_state param; tempfile
# matches INV-DET-1's fixture-isolation idiom. Pinned to the exact versions
# m0d resolves (Cargo.lock, root workspace).
xaak = { path = "../../lineos/m1/xaak" }
arc-swap = "1.9"
tempfile = "3.27.0"
# 2026-08-24: restoration_chain_what.rs writes per-stage null-test wavs.
# Same version sp314-dsp resolves (Cargo.lock, root workspace).
hound = "3.5"
# 2026-08-24: reference_resolver_oracle.rs calls the REAL ReferenceResolver
# (shared/aether-bridge) to compare against the Python oracle fixture.
aether-bridge = { path = "../../shared/aether-bridge" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# 2026-08-24: export_button_reality.rs drives the REAL axum handler
# m0d::handlers::export::export_audio in-process (it is the only pub entry
# that reaches the private export_mp3 — export_blob/export_mp3 are both
# private). That handler is async and takes State<AppState>, so the
# instrument needs a tokio runtime and the axum extractors. Pinned to the
# versions m0d resolves (Cargo.lock, root workspace).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.7"

# 2026-08-25: acx_bridge_e2e εγκαθιστά subscriber ώστε να ΑΠΟΔΕΙΧΘΕΙ ότι το
# export_mp3_routed εκπέμπει το AcxExportOutcome αντί να το πετάει. Ίδιες
# εκδόσεις με m0d (Cargo.lock, root workspace).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 2026-09-18: source_channel_probe.rs χρειάζεται το ΙΔΙΟ symphonia probe
# με το decode.rs (container channel count), χωρίς το duration cap που
# έχει το decode_raw_interleaved της παραγωγής. Ίδια version/features
# με m0d (Cargo.toml:45-52).
symphonia = { version = "0.5", features = ["mp3", "flac", "pcm", "aiff", "wav", "isomp4"] }

[workspace]

# ⚠ ΠΡΟΣΩΡΙΝΟ — 2026-08-24, execution_order recon.
# Το graph.execution_order ίχνος ([BISECT-...-GRAPH-NODE], dsp/mod.rs)
# ζει πίσω από `#[cfg(debug_assertions)]`, άρα ΑΠΑΙΤΕΙΤΑΙ debug build.
# Τα opt-level και debug_assertions είναι ΑΝΕΞΑΡΤΗΤΑ στο Cargo: με
# opt-level=3 ο κώδικας βελτιστοποιείται ΚΑΙ το debug_assertions
# παραμένει true, οπότε το όργανο εξακολουθεί να τυπώνει.
# ΑΦΟΡΑ ΜΟΝΟ αυτό το detached research workspace, ΟΧΙ το production.
# Ο χρήστης αποφασίζει αν μένει.
[profile.dev]
opt-level = 3
